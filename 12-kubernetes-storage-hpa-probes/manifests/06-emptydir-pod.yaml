# Volumes, the ephemeral kind: two containers share an emptyDir. It lives as
# long as the pod does and is wiped when the pod goes.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: production-webapp
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "echo written-by-writer > /shared/msg; sleep 3600"]
      volumeMounts: [{ name: shared, mountPath: /shared }]
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{ name: shared, mountPath: /shared }]
  volumes:
    - name: shared
      emptyDir: {}
