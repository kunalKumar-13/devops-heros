# The Argo CD Application: which repo and path to watch, and where to deploy.
# It lives outside gitops/app/ on purpose: the Application describes the
# watching, it is not one of the workloads being watched.
#
# TARGET_REVISION is the branch to follow. The pipeline points it at a
# short-lived branch so it can push a real Git change and watch it deploy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session20-mini
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kunalKumar-13/devops-heros.git
    targetRevision: TARGET_REVISION
    path: 19-monitoring-observability-gitops/gitops/app
  destination:
    server: https://kubernetes.default.svc
    namespace: session20
  syncPolicy:
    automated:
      prune: true        # delete what was removed from Git
      selfHeal: true     # undo changes made to the cluster outside Git
    syncOptions:
      - CreateNamespace=true
