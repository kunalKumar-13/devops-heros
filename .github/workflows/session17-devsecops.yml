# Session 17: complete CI/CD with security built in, for the API in 16-devsecops/.
#
#   tests ─┬─ SAST (CodeQL + Bandit) ─┐
#          ├─ SCA  (pip-audit)        ├─ build → image scan (Trivy) → security gate → push to GHCR → deploy to kind
#          └─ secret scan (gitleaks)  ┘
#
# Nothing is pushed or deployed unless every security check passes.

name: "Session 17: DevSecOps"

on:
  push:
    branches: [assignment]
    paths: ["16-devsecops/**", ".github/workflows/session17-devsecops.yml"]
  pull_request:
    paths: ["16-devsecops/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: 16-devsecops
    shell: bash                 # bash -eo pipefail: a failing command in a pipe fails the step

# Third-party actions are pinned to a full commit SHA (the tag is in the
# comment): a tag can be moved to malicious code if an action's repository is
# compromised, a commit SHA cannot. Every job starts with read-only access.
permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest

  sast:
    name: SAST (CodeQL + Bandit)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write          # CodeQL uploads its results to the Security tab
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: python
          source-root: 16-devsecops
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: session17
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Bandit (fails on medium or high severity)
        run: |
          pip install -q bandit==1.9.4
          bandit -r app -ll -f txt

  sca:
    name: SCA (pip-audit)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Audit the runtime dependencies against known vulnerabilities
        run: |
          pip install -q pip-audit==2.10.1
          pip-audit -r requirements.txt --strict --desc

  secrets:
    name: Secret scanning (gitleaks)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0               # scan the whole history, not just the last commit
      - name: Scan every commit for leaked credentials
        working-directory: .
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  image:
    name: Build and scan the image
    needs: [sast, sca, secrets]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        working-directory: .
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/secure-api:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::12} -t ${{ steps.name.outputs.image }} .
      - name: Trivy report (everything, never fails)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}
          format: table
          exit-code: "0"
      - name: Security gate (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save the scanned image for the next jobs
        run: docker save ${{ steps.name.outputs.image }} | gzip > /tmp/image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: scanned-image
          path: /tmp/image.tar.gz
          retention-days: 3

  push:
    name: Push to GHCR
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with: { name: scanned-image, path: /tmp }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push exactly the image that was scanned
        working-directory: .
        run: |
          docker load < /tmp/image.tar.gz
          docker push ${{ needs.image.outputs.image }}

  deploy:
    name: Deploy to Kubernetes (kind)
    needs: [image, push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with: { cluster_name: devsecops }
      - uses: actions/download-artifact@v7
        with: { name: scanned-image, path: /tmp }
      - name: Load the scanned image into the cluster
        run: |
          docker load < /tmp/image.tar.gz
          kind load docker-image ${{ needs.image.outputs.image }} --name devsecops
      - name: Deploy
        run: |
          sed "s#IMAGE_PLACEHOLDER#${{ needs.image.outputs.image }}#" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/secure-api --timeout=180s
          kubectl get pods -l app=secure-api -o wide
      - name: Smoke test, and confirm the hardening took effect
        run: |
          kubectl run smoke --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            sh -c 'curl -s http://secure-api/health; echo; curl -s "http://secure-api/add?a=2&b=3"; echo'
          pod=$(kubectl get pod -l app=secure-api -o jsonpath='{.items[0].metadata.name}')
          echo "user inside the container: $(kubectl exec $pod -- id)"
          kubectl exec $pod -- sh -c 'touch /app/x 2>&1 || echo "root filesystem is read-only, as configured"'
