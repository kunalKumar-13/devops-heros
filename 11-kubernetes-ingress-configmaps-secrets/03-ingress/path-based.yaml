# Path-based routing: ONE host, different services per URL prefix.
# /api  -> api-svc      /shop -> shop-svc      /     -> web-svc
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-based
  annotations:
    # strip the matched prefix before forwarding, so /api/users reaches the
    # backend as /users
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: kunal-devops.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-svc
                port:
                  number: 80
          - path: /shop(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: shop-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-svc
                port:
                  number: 80
