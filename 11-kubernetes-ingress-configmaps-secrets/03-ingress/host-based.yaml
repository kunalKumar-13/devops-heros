# Host-based routing: different hostnames, same cluster IP, routed on the HTTP
# Host header. Both names must resolve to the ingress controller's address --
# on minikube that means adding them to /etc/hosts.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: host-based
spec:
  ingressClassName: nginx
  rules:
    - host: api.kunal-devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-svc
                port:
                  number: 80
    - host: shop.kunal-devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shop-svc
                port:
                  number: 80
