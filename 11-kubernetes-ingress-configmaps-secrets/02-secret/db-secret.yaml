# stringData takes plain text and Kubernetes base64-encodes it for you -- this is
# the field to use when writing a Secret by hand. `data` would require you to
# pre-encode, and `echo` without -n silently bakes a trailing newline into the
# value, which is the classic reason a password "looks right" and still fails.
#
# base64 is ENCODING, NOT ENCRYPTION. Anyone with get-secret RBAC can decode
# this. Real clusters add encryption-at-rest for etcd or an external store
# (Vault, Sealed Secrets, a cloud secrets manager) -- which is also why a file
# like this never belongs in git for a real service.
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:
  DB_USER: "appuser"
  DB_PASSWORD: "S3cur3-Pa55w0rd"
