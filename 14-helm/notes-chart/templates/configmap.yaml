apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "notes.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.app.name | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  index.html: |
    <!doctype html>
    <html><head><title>{{ .Values.app.name }}</title></head>
    <body style="font-family: sans-serif; max-width: 640px; margin: 40px auto">
      <h1>{{ .Values.app.name }}</h1>
      <p>environment: <b>{{ .Values.app.environment }}</b> &middot;
         release: <b>{{ .Release.Name }}</b> &middot;
         revision: <b>{{ .Release.Revision }}</b> &middot;
         image: <b>{{ .Values.image.repository }}:{{ .Values.image.tag }}</b></p>
      <ul>
      {{- range .Values.app.notes }}
        <li>{{ . }}</li>
      {{- end }}
      </ul>
    </body></html>
