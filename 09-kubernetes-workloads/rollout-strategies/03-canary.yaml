# Canary the plain-Kubernetes way: ONE Service selects on `app: demo` only, so it
# load-balances across both Deployments. Traffic share is decided by replica
# count -- 9 stable + 1 canary is roughly 10% on the new version. Scale the
# canary up as confidence grows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: demo
      track: stable
  template:
    metadata:
      labels:
        app: demo
        track: stable
    spec:
      containers:
        - name: app
          image: nginx:1.26-alpine
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
      track: canary
  template:
    metadata:
      labels:
        app: demo
        track: canary
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-canary-svc
spec:
  selector:
    app: demo          # deliberately NOT matching on track -- that is the split
  ports:
    - port: 80
      targetPort: 80
