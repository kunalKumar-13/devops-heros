# Pods get stable ordinal names (web-0, web-1, web-2), are created in order, and
# each one keeps its OWN PersistentVolumeClaim across restarts and rescheduling.
# The headless service below is what gives each pod its stable DNS name.
apiVersion: v1
kind: Service
metadata:
  name: web-headless
  labels:
    app: web-sts
spec:
  clusterIP: None          # headless -> DNS returns pod IPs, not one virtual IP
  selector:
    app: web-sts
  ports:
    - port: 80
      name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web-headless
  replicas: 3
  selector:
    matchLabels:
      app: web-sts
  template:
    metadata:
      labels:
        app: web-sts
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
