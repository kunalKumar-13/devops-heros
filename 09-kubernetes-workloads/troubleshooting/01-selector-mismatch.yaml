# BROKEN ON PURPOSE. The Deployment labels its pods app: web-v2 while the
# Service selects app: web. The Service is created, gets a ClusterIP, and has
# ZERO endpoints - curl fails with connection refused and nothing in the
# Service description hints at why.
#
# Diagnose:
#   kubectl get endpointslice -l kubernetes.io/service-name=broken-svc
#   kubectl describe svc broken-svc      # compare Selector ...
#   kubectl get pods --show-labels       # ... with the pods actual labels
# Fix: make the selector and the pod labels identical.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-selector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-v2
  template:
    metadata:
      labels:
        app: web-v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: broken-svc
spec:
  selector:
    app: web        # <-- does not match app: web-v2
  ports:
    - port: 80
      targetPort: 80
