# Graceful shutdown. On delete the kubelet sends SIGTERM, waits up to
# terminationGracePeriodSeconds, then SIGKILLs. The preStop hook runs BEFORE the
# SIGTERM - the usual use is to sleep a few seconds so the endpoint removal
# propagates and no new request lands on a pod that is about to die.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: app
      image: nginx:1.27-alpine
      lifecycle:
        preStop:
          exec:
            command: ["sh", "-c", "sleep 5; nginx -s quit"]
