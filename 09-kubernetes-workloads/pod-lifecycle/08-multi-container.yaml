# Two containers in one pod: they share the network namespace (localhost) and an
# emptyDir volume. This is the sidecar pattern - the writer produces a file, the
# server serves it, and neither knows about the other.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-sidecar
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date > /data/index.html; sleep 10; done"]
      volumeMounts:
        - name: shared
          mountPath: /data
    - name: server
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared
          mountPath: /usr/share/nginx/html
