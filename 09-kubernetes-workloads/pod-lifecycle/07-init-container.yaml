# Init containers run to completion, in order, BEFORE any app container starts.
# If one fails it is retried, and the app container never runs - which makes
# this the right place for a dependency gate or a schema migration.
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
spec:
  initContainers:
    - name: wait-for-service
      image: busybox:1.36
      command: ["sh", "-c", "echo waiting for dependency; sleep 5; echo dependency ready"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
